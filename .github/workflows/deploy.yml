name: Deploy updated site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest application source
        uses: actions/checkout@v4
        with:
          ref: ihb-development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Publish static site to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./dist/client
          keep_files: true
          commit_message: "部署最新网站版本"
